<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Terra 설치기 — S8 완료</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;background:#07090c;color:#ede9e1}
*{box-sizing:border-box}
.win{width:960px;height:640px;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(800px 420px at 90% -15%,rgba(90,168,255,.10),transparent 60%),radial-gradient(700px 400px at -5% 115%,rgba(240,166,58,.08),transparent 60%),#07090c}
.hd{height:52px;flex:none;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid rgba(255,255,255,.10);background:rgba(13,15,19,.82)}
.wm{font-size:13px;font-weight:600;letter-spacing:.42em}
.cap{font-size:10px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:#9aa1ab}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 9px;border-radius:10px;font-size:11px;font-family:'JetBrains Mono',monospace;border:1px solid rgba(255,255,255,.18);color:#b4bac3;background:rgba(255,255,255,.05);white-space:nowrap}
.ok{color:#3ecf8e;border-color:rgba(62,207,142,.5);background:rgba(62,207,142,.10)}
.stp{height:44px;flex:none;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid rgba(255,255,255,.07)}
.s{display:flex;align-items:center;gap:7px;flex:1;font-size:12px;color:#8b929d;white-space:nowrap}
.s:not(:last-child)::after{content:'';flex:1;height:1px;margin:0 8px;min-width:8px;background:rgba(255,255,255,.12)}
.s i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font:500 10px 'JetBrains Mono',monospace;font-style:normal;flex:none}
.s.on{color:#ede9e1;font-weight:600}
.s.on i{border-color:#ede9e1;box-shadow:0 0 0 3px rgba(237,233,225,.12)}
.s.done{color:#b4bac3}
.s.done i{background:#3ecf8e;border-color:#3ecf8e;font-size:0}
.s.done i::before{content:'';width:4px;height:8px;border:solid #07090c;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.bd{flex:1;min-height:0;padding:18px 40px 0;display:flex;flex-direction:column}
.ft{height:60px;flex:none;display:flex;align-items:center;gap:10px;padding:0 40px;border-top:1px solid rgba(255,255,255,.10);background:rgba(13,15,19,.82)}
.btn{height:38px;padding:0 20px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:#ede9e1;font:600 13px 'Noto Sans KR',sans-serif;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.09)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.pnl{border-radius:14px;border:1px solid rgba(255,255,255,.10);background:rgba(13,15,19,.82);box-shadow:0 10px 30px rgba(0,0,0,.30)}
h1{margin:6px 0 4px;font-size:22px;font-weight:700;letter-spacing:-.01em}
.sub{margin:0;font-size:13px;line-height:1.6;color:#b4bac3}
.hint{font-size:12px;line-height:1.5;color:#9aa1ab}
.ev{display:flex;align-items:center;gap:10px;height:30px;font-size:13px;color:#b4bac3}
.ev .ic{width:18px;height:18px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.ev.d .ic{background:#3ecf8e;border-color:#3ecf8e}
.ev.d .ic::before{content:'';width:4px;height:8px;border:solid #07090c;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ev.r{color:#ede9e1;font-weight:600}
.ev.r .ic{border-color:#7aa7ff;animation:pulse 1.4s ease-in-out infinite}
.ev.w{color:#8b929d}
.ev .t{margin-left:auto;font:500 11px 'JetBrains Mono',monospace;color:#9aa1ab}
.sb{margin-left:28px;padding-left:14px;border-left:1px solid rgba(255,255,255,.12)}
.sb .ev{height:28px;font-size:12.5px}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:78%;border-radius:4px;background:repeating-linear-gradient(110deg,#ede9e1 0 12px,#c9c4b8 12px 24px);background-size:32px 100%;animation:slide .9s linear infinite}
.sg{display:flex;border:1px solid rgba(255,255,255,.18);border-radius:9px;overflow:hidden;background:#0e1013}.sg button{height:28px;padding:0 12px;border:0;border-right:1px solid rgba(255,255,255,.10);background:transparent;color:#b4bac3;font:500 11.5px "Noto Sans KR",sans-serif;cursor:pointer}.sg button:last-child{border-right:0}.sg button[aria-pressed=true]{background:#ede9e1;color:#111;font-weight:700}.wn{color:#f5b83d;border-color:rgba(245,184,61,.5);background:rgba(245,184,61,.10)}.btn.pri{background:#ede9e1;color:#111;border-color:#ede9e1}.kv{display:flex;gap:12px;padding:7px 0;border-top:1px solid rgba(255,255,255,.07)}.kv span:first-child{width:70px;flex:none;font-size:12px;color:#9aa1ab}.kv span:last-child{flex:1;font-size:12.5px}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(122,167,255,.5)}50%{box-shadow:0 0 0 5px rgba(122,167,255,0)}}
@keyframes slide{0%{background-position:0 0}100%{background-position:32px 0}}
@media (prefers-reduced-motion:reduce){.ev.r .ic,.bar i{animation:none}}

.win{display:grid;grid-template-columns:168px minmax(0,1fr);grid-template-rows:52px minmax(0,1fr) 60px}
.hd{grid-column:1/3;grid-row:1}
.stp{grid-column:1;grid-row:2/4;height:auto;flex-direction:column;align-items:flex-start;justify-content:flex-start;padding:22px 20px;border-bottom:0;border-right:1px solid rgba(255,255,255,.10);background:rgba(13,15,19,.5)}
.stp::before{content:'진행 상황';font-size:10px;font-weight:600;letter-spacing:.28em;color:#9aa1ab;margin-bottom:16px}
.s{flex:none;width:100%;height:44px;align-items:flex-start;position:relative;font-size:13px;line-height:18px}
.s:not(:last-child)::after{content:'';position:absolute;left:8px;top:24px;bottom:2px;width:1px;height:auto;min-width:0;margin:0;flex:none;background:rgba(255,255,255,.14)}
.s.done:not(:last-child)::after{background:rgba(62,207,142,.55)}
.bd{grid-column:2;grid-row:2;padding:18px 32px 0;overflow:hidden}
.ft{grid-column:2;grid-row:3;padding:0 32px}
/*stp-left*/
.pnl,.card,.inp,.seg,.chip,.btn,.alert,.cmd,.note,.sg{border:0!important}
.seg button,.seg span,.sg button{border:0!important}
[style*="border:1px solid"]{border:0!important}
.pnl,.card{background:rgba(255,255,255,.045)!important}
.btn{background:rgba(255,255,255,.09)}
.btn:hover{background:rgba(255,255,255,.15)}
.btn.pri{background:#ede9e1}
.btn.dg{background:rgba(255,93,93,.12)}
.inp,.cmd,.seg,.sg{background:rgba(0,0,0,.35)}
.seg button.sel,.seg span.sel,.sg button[aria-pressed=true]{background:#ede9e1}
.chip{background-clip:padding-box}
/*noborder*/</style>
</helmet>
<div class="win">
  <div class="hd">
    <img src="/_blob/e73e951b60dbbe231a3619cceb4a3087" alt="" style="width:24px;height:24px">
    <span class="wm">TERRA</span><span class="cap" style="margin-left:4px">설치기</span>
    <span style="margin-left:auto"></span>
    <span class="chip ok">서명 확인됨</span><span class="mono" style="font-size:11px;color:#9aa1ab">카탈로그 0.6.0</span>
  </div>
  <div class="stp">
    <div class="s done"><i>1</i>역할</div><div class="s done"><i>2</i>연결</div><div class="s done"><i>3</i>모듈</div><div class="s done"><i>4</i>의존성</div><div class="s done"><i>5</i>옵션</div><div class="s done"><i>6</i>요약</div><div class="s done"><i>7</i>설치</div><div class="s done"><i>8</i>완료</div>
  </div>
  <div class="bd">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="width:30px;height:30px;border-radius:50%;background:#3ecf8e;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="18" height="18" style="fill:none;stroke:#07090c;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12l5 5 9-10"/></svg></span>
      <h1 style="margin:0">{{title}}</h1>
      <span style="margin-left:auto" class="sg" role="group" aria-label="상황 미리보기">
        <button aria-pressed="{{p0}}" onClick="{{go0}}">Tree 설치</button><button aria-pressed="{{p1}}" onClick="{{go1}}">Leaf 등록됨</button><button aria-pressed="{{p2}}" onClick="{{go2}}">Leaf 등록 안 함</button><button aria-pressed="{{p3}}" onClick="{{go3}}">등록 지연</button>
      </span>
    </div>
    <p class="sub" style="margin-top:8px">{{lead}}</p>

    <div style="display:flex;gap:14px;margin-top:14px;min-height:0">
      <div class="pnl" style="flex:1.2;min-width:0;padding:16px 20px">
        <span class="cap">다음 한 걸음</span>
        <div style="margin-top:8px;font-size:16px;font-weight:700;line-height:1.45">{{stepTitle}}</div>
        <div class="sub" style="margin-top:6px">{{stepBody}}</div>
        <sc-if value="{{showAddr}}" hint-placeholder-val="{{ true }}">
          <div style="margin-top:12px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:#0e1013;display:flex;align-items:center;padding:0 14px"><span class="mono" style="font-size:12.5px">http://127.0.0.1:8080</span><span class="hint" style="margin-left:auto">이 컴퓨터에서만 열려요</span></div>
        </sc-if>
        <sc-if value="{{showWarn}}" hint-placeholder-val="{{ false }}">
          <div style="margin-top:12px;display:flex;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid rgba(245,184,61,.4);background:rgba(245,184,61,.07);color:#e6d39f;font-size:12px;line-height:1.55">
            <svg viewBox="0 0 24 24" width="16" height="16" style="flex:none;margin-top:1px;color:#f5b83d;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/></svg>
            <span>{{warn}}</span>
          </div>
        </sc-if>
      </div>
      <div class="pnl" style="flex:1;min-width:0;padding:14px 20px 8px">
        <span class="cap">설치 결과</span>
        <div class="kv" style="margin-top:6px;border-top:0"><span>버전</span><span class="mono" style="font-size:12px">0.6.0</span></div>
        <div class="kv"><span>역할</span><span>{{roles}}</span></div>
        <div class="kv"><span>서비스</span><span class="mono" style="font-size:11.5px">{{services}}</span></div>
        <div class="kv"><span>모듈</span><span><span class="chip ok">4개 설치됨</span> <span class="chip wn">1개는 연결 후 채워져요</span></span></div>
        <div class="kv"><span>위치</span><span class="mono" style="font-size:11.5px">~/.local/share/terra/terra/</span></div>
      </div>
    </div>
  </div>
  <div class="ft">
    <button class="btn">설치 기록 보기</button>
    <span style="margin-left:auto"></span>
    <button class="btn">닫기</button>
    <button class="btn pri" style="padding:0 28px">{{cta}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":640}}'>
const CASES = [
  { title:'Tree 설치가 끝났어요', lead:'Master가 켜졌어요. 이 컴퓨터가 Terra의 중심이 됩니다.', stepTitle:'Leaf를 붙일 주소를 열어 두세요', stepBody:'다른 컴퓨터의 Leaf가 붙으려면 Master 수신 주소가 필요해요. 연결 화면에서 코드를 만들 수 있습니다.', showAddr:true, showWarn:false, warn:'', roles:'Tree', services:'terra-daemon · terra-master', cta:'Terra 열기' },
  { title:'Leaf 등록까지 끝났어요', lead:'Tree가 이 노드를 알아봤어요. 모듈은 Tree에서 이어서 채워집니다.', stepTitle:'이제 Terra를 열어도 돼요', stepBody:'Tree 쪽 노드 목록에 이 컴퓨터가 나타났어요. 남은 모듈은 연결된 동안 자동으로 내려옵니다.', showAddr:false, showWarn:false, warn:'', roles:'Leaf · 등록됨', services:'terra-daemon · terra-leaf-host', cta:'Terra 열기' },
  { title:'Leaf 설치는 끝났어요', lead:'아직 Tree에 등록하지 않았어요.', stepTitle:'등록하기 전에는 할 수 있는 일이 없어요', stepBody:'이 컴퓨터의 브라우저에서는 등록 전까지 열 화면이 없습니다. 유지관리에서 언제든 등록할 수 있어요.', showAddr:false, showWarn:false, warn:'', roles:'Leaf · 등록 안 함', services:'terra-daemon · terra-leaf-host', cta:'지금 등록하기' },
  { title:'설치는 끝났지만 등록이 늦어요', lead:'3분 안에 Tree가 응답하지 않았어요. 설치는 그대로 남아 있습니다.', stepTitle:'등록만 다시 시도하면 돼요', stepBody:'Tree가 켜져 있고 주소가 맞는지 확인한 뒤 등록을 다시 시도하세요. 파일을 다시 받지 않아요.', showAddr:false, showWarn:true, warn:'Daemon을 서비스가 아니라 직접 띄운 경우 재시작이 끝나지 않을 수 있어요.', roles:'Leaf · 등록 대기', services:'terra-daemon · terra-leaf-host', cta:'등록 다시 시도' }
];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { c: 0 }; }
  renderVals() {
    const c = this.state.c, d = CASES[c];
    const v = Object.assign({}, d);
    for (let i = 0; i < 4; i++) { v['p' + i] = c === i ? 'true' : 'false'; v['go' + i] = () => this.setState({ c: i }); }
    return v;
  }
}
</script>
</body>
</html>
