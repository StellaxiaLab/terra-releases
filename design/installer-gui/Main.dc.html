<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Terra 설치기 — S1 역할</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;background:#07090c;color:#ede9e1}
*{box-sizing:border-box}
.win{width:960px;height:640px;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(800px 420px at 90% -15%,rgba(90,168,255,.10),transparent 60%),radial-gradient(700px 400px at -5% 115%,rgba(240,166,58,.08),transparent 60%),#07090c}
.hd{height:52px;flex:none;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid rgba(255,255,255,.10);background:rgba(13,15,19,.82)}
.wm{font-size:13px;font-weight:600;letter-spacing:.42em}
.cap{font-size:10px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:#9aa1ab}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 9px;border-radius:10px;font-size:11px;font-family:'JetBrains Mono',monospace;border:1px solid rgba(255,255,255,.18);color:#b4bac3;background:rgba(255,255,255,.05);white-space:nowrap}
.ok{color:#3ecf8e;border-color:rgba(62,207,142,.5);background:rgba(62,207,142,.10)}
.tr{color:#f0a63a;border-color:rgba(240,166,58,.5);background:rgba(240,166,58,.10)}
.lf{color:#5aa8ff;border-color:rgba(90,168,255,.5);background:rgba(90,168,255,.10)}
.stp{height:44px;flex:none;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid rgba(255,255,255,.07)}
.s{display:flex;align-items:center;gap:7px;flex:1;font-size:12px;color:#8b929d;white-space:nowrap}
.s:not(:last-child)::after{content:'';flex:1;height:1px;margin:0 8px;min-width:8px;background:rgba(255,255,255,.12)}
.s i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font:500 10px 'JetBrains Mono',monospace;font-style:normal;flex:none}
.s.on{color:#ede9e1;font-weight:600}
.s.on i{border-color:#ede9e1;box-shadow:0 0 0 3px rgba(237,233,225,.12)}
.s.done{color:#b4bac3}
.s.done i{background:#3ecf8e;border-color:#3ecf8e;font-size:0}
.s.done i::before{content:'';width:4px;height:8px;border:solid #07090c;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.bd{flex:1;min-height:0;padding:20px 40px 0;display:flex;flex-direction:column}
.ft{height:60px;flex:none;display:flex;align-items:center;gap:10px;padding:0 40px;border-top:1px solid rgba(255,255,255,.10);background:rgba(13,15,19,.82)}
.btn{height:38px;padding:0 20px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:#ede9e1;font:600 13px 'Noto Sans KR',sans-serif;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.09)}
.btn.pri{background:#ede9e1;color:#111;border-color:#ede9e1}
.btn:disabled{opacity:.35;cursor:not-allowed}
.pnl{border-radius:14px;border:1px solid rgba(255,255,255,.10);background:rgba(13,15,19,.82);box-shadow:0 10px 30px rgba(0,0,0,.30)}
h1{margin:6px 0 4px;font-size:22px;font-weight:700;letter-spacing:-.01em}
.sub{margin:0;font-size:13px;line-height:1.6;color:#b4bac3}
.hint{font-size:12px;line-height:1.5;color:#9aa1ab}
.card{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;text-align:left;padding:18px;border-radius:14px;border:1px solid rgba(255,255,255,.10);color:#ede9e1;font-family:inherit;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.30)}

.win{display:grid;grid-template-columns:168px minmax(0,1fr);grid-template-rows:52px minmax(0,1fr) 60px}
.hd{grid-column:1/3;grid-row:1}
.stp{grid-column:1;grid-row:2/4;height:auto;flex-direction:column;align-items:flex-start;justify-content:flex-start;padding:22px 20px;border-bottom:0;border-right:1px solid rgba(255,255,255,.10);background:rgba(13,15,19,.5)}
.stp::before{content:'진행 상황';font-size:10px;font-weight:600;letter-spacing:.28em;color:#9aa1ab;margin-bottom:16px}
.s{flex:none;width:100%;height:44px;align-items:flex-start;position:relative;font-size:13px;line-height:18px}
.s:not(:last-child)::after{content:'';position:absolute;left:8px;top:24px;bottom:2px;width:1px;height:auto;min-width:0;margin:0;flex:none;background:rgba(255,255,255,.14)}
.s.done:not(:last-child)::after{background:rgba(62,207,142,.55)}
.bd{grid-column:2;grid-row:2;padding:18px 32px 0;overflow:hidden}
.ft{grid-column:2;grid-row:3;padding:0 32px}
/*stp-left*/
.pnl,.card,.inp,.seg,.chip,.btn,.alert,.cmd,.note,.sg{border:0!important}
.seg button,.seg span,.sg button{border:0!important}
[style*="border:1px solid"]{border:0!important}
.pnl,.card{background:rgba(255,255,255,.045)!important}
.btn{background:rgba(255,255,255,.09)}
.btn:hover{background:rgba(255,255,255,.15)}
.btn.pri{background:#ede9e1}
.btn.dg{background:rgba(255,93,93,.12)}
.inp,.cmd,.seg,.sg{background:rgba(0,0,0,.35)}
.seg button.sel,.seg span.sel,.sg button[aria-pressed=true]{background:#ede9e1}
.chip{background-clip:padding-box}
/*noborder*/
:focus-visible{outline:2px solid #7aa7ff!important;outline-offset:2px}
.btn.pri:focus-visible,.seg button.sel:focus-visible,.sg button[aria-pressed=true]:focus-visible{outline-color:#7aa7ff;outline-offset:3px}
.card[aria-pressed=true],.act[aria-pressed=true]{box-shadow:inset 0 0 0 2px rgba(237,233,225,.6)!important}
.cnt{display:none;font:500 11px 'JetBrains Mono',monospace;color:#9aa1ab}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:800px){.win{width:100%}.win.stp-m,.win{grid-template-columns:minmax(0,1fr);grid-template-rows:52px 44px minmax(0,1fr) 60px}.stp{grid-column:1;grid-row:2;flex-direction:row;align-items:center;height:44px;padding:0 20px;border-right:0;border-bottom:1px solid rgba(255,255,255,.07)}.stp::before{margin:0 14px 0 0}.s:not(.on){display:none}.s.on{height:auto}.s::after{display:none}.cnt{display:inline;margin-left:auto}.bd{grid-column:1;grid-row:3;padding:18px 20px 0}.ft{grid-column:1;grid-row:4;padding:0 20px}}
.win.nar{width:780px;grid-template-columns:minmax(0,1fr);grid-template-rows:52px 44px minmax(0,1fr) 60px}.nar .stp{grid-column:1;grid-row:2;flex-direction:row;align-items:center;height:44px;padding:0 20px;border-right:0;border-bottom:1px solid rgba(255,255,255,.07)}.nar .stp::before{margin:0 14px 0 0}.nar .s:not(.on){display:none}.nar .s.on{height:auto}.nar .s::after{display:none}.nar .cnt{display:inline;margin-left:auto}.nar .bd{grid-column:1;grid-row:3;padding:18px 20px 0}.nar .ft{grid-column:1;grid-row:4;padding:0 20px}
/*a11y-v2*/</style>
</helmet>
<div class="win">
  <div class="hd">
    <img src="/_blob/e73e951b60dbbe231a3619cceb4a3087" alt="" style="width:24px;height:24px">
    <span class="wm">TERRA</span><span class="cap" style="margin-left:4px">설치기</span>
    <span style="margin-left:auto"></span>
    <span class="chip ok">서명 확인됨</span><span class="mono" style="font-size:11px;color:#9aa1ab">카탈로그 0.6.0</span>
  </div>
  <div class="stp">
    <div class="s on"><i>1</i>역할</div><div class="s"><i>2</i>연결</div><div class="s"><i>3</i>모듈</div><div class="s"><i>4</i>의존성</div><div class="s"><i>5</i>옵션</div><div class="s"><i>6</i>요약</div><div class="s"><i>7</i>설치</div><div class="s"><i>8</i>완료</div>
  <span class="cnt">1 / 8</span></div>
  <div class="bd">
    <h1>무엇을 설치할까요?</h1>
    <p class="sub">둘 다 고를 수 있어요. 둘 다 고르면 Tree를 먼저 설치합니다.</p>

    <div style="display:flex;gap:16px;margin-top:16px">
      <button class="card" aria-pressed="{{tree.pressed}}" onClick="{{toggleTree}}" style="background:{{tree.bg}};border-color:{{tree.bd}}">
        <div style="display:flex;align-items:center;gap:12px">
          <span style="width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#f0a63a;background:rgba(240,166,58,.12);border:1px solid rgba(240,166,58,.40)"><svg viewBox="0 0 24 24" width="22" height="22" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M12 21v-7"/><path d="M12 3a6 6 0 0 0-5 9h10a6 6 0 0 0-5-9z"/></svg></span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:17px;font-weight:700">Tree</span><span class="cap" style="color:#f0a63a;letter-spacing:.16em">새 Tree 만들기</span></span>
          <span style="width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.28);color:#111;background:{{tree.box}}"><sc-if value="{{tree.on}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="15" height="15" style="fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12l5 5 9-10"/></svg></sc-if></span>
        </div>
        <span style="font-size:13px;line-height:1.6;color:#b4bac3">클러스터의 중심이에요. 사용자와 권한, 노드 등록, 자원 현황을 한곳에서 관리합니다.</span>
        <div style="display:flex;flex-wrap:wrap;gap:6px"><span class="chip">master</span><span class="chip">gateway</span></div>
        <div style="margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;border-top:1px solid rgba(255,255,255,.10)"><span class="hint">디스크 예상</span><span class="mono" style="font-size:12px;color:#b4bac3">약 96 MB</span></div>
      </button>

      <button class="card" aria-pressed="{{leaf.pressed}}" onClick="{{toggleLeaf}}" style="background:{{leaf.bg}};border-color:{{leaf.bd}}">
        <div style="display:flex;align-items:center;gap:12px">
          <span style="width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#5aa8ff;background:rgba(90,168,255,.12);border:1px solid rgba(90,168,255,.40)"><svg viewBox="0 0 24 24" width="22" height="22" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M5 19c0-8 6-14 15-14 0 9-6 15-14 15"/><path d="M5 19l7-7"/></svg></span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:17px;font-weight:700">Leaf</span><span class="cap" style="color:#5aa8ff;letter-spacing:.16em">기존 Tree에 붙기</span></span>
          <span style="width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.28);color:#111;background:{{leaf.box}}"><sc-if value="{{leaf.on}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="15" height="15" style="fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12l5 5 9-10"/></svg></sc-if></span>
        </div>
        <span style="font-size:13px;line-height:1.6;color:#b4bac3">이 컴퓨터를 노드로 만들어요. 장치와 파일, 서비스 터널, 모듈을 Tree에 내놓습니다.</span>
        <div style="display:flex;flex-wrap:wrap;gap:6px"><span class="chip">daemon</span><span class="chip">gateway</span><span class="chip">network helper</span></div>
        <div style="margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;border-top:1px solid rgba(255,255,255,.10)"><span class="hint">디스크 예상</span><span class="mono" style="font-size:12px;color:#b4bac3">약 142 MB</span></div>
      </button>
    </div>

    <div class="pnl" style="margin-top:14px;padding:11px 16px;display:flex;align-items:center;gap:12px;box-shadow:none">
      <svg viewBox="0 0 24 24" width="18" height="18" style="flex:none;color:#7aa7ff;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>
      <span style="font-size:12.5px;line-height:1.55;color:#b4bac3">{{note}}</span>
    </div>
  </div>
  <div class="ft">
    <button class="btn">취소</button>
    <span style="margin-left:auto"></span>
    <button class="btn" disabled>이전</button>
    <button class="btn pri" disabled="{{none}}" style="padding:0 28px">다음</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":640}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { treeOn: true, leafOn: true };
  }
  renderVals() {
    const { treeOn, leafOn } = this.state;
    const look = (on, rgb) => ({
      on,
      pressed: on ? 'true' : 'false',
      bg: on ? 'rgba(' + rgb + ',.08)' : 'rgba(13,15,19,.82)',
      bd: on ? 'rgba(' + rgb + ',.55)' : 'rgba(255,255,255,.10)',
      box: on ? '#ede9e1' : 'transparent'
    });
    let note = '역할을 하나 이상 골라야 계속할 수 있어요.';
    if (treeOn && leafOn) note = 'Tree를 먼저 설치하고 Leaf를 이어서 설치합니다. 같은 컴퓨터의 Tree라서 Leaf 연결은 자동으로 이어져요.';
    else if (treeOn) note = 'Tree만 설치합니다. 다른 컴퓨터의 Leaf가 붙으려면 설치 뒤 Master 수신 주소를 열어야 해요.';
    else if (leafOn) note = 'Leaf만 설치합니다. 다음 단계에서 붙을 Tree의 주소를 입력해요.';
    return {
      tree: look(treeOn, '240,166,58'),
      leaf: look(leafOn, '90,168,255'),
      note,
      none: !treeOn && !leafOn,
      toggleTree: () => this.setState({ treeOn: !this.state.treeOn }),
      toggleLeaf: () => this.setState({ leafOn: !this.state.leafOn })
    };
  }
}
</script>
</body>
</html>
